<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel 06 — Political Volatility & Composite Threat Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter Tight', 'Inter', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C8C2B8; border-radius: 2px; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

// ── Data ─────────────────────────────────────────────────────
const COUNTRIES = [
  { id:"Gaza",          tier:1, wri:5.0, conflict:9.8, depl:97,  pop:2.3,  extract:182,  tAnom:1.8, precDef:-55 },
  { id:"Yemen",         tier:1, wri:4.8, conflict:9.7, depl:95,  pop:34.5, extract:168,  tAnom:2.1, precDef:-62 },
  { id:"Kuwait",        tier:2, wri:4.9, conflict:4.2, depl:78,  pop:4.4,  extract:2650, tAnom:2.6, precDef:-53 },
  { id:"UAE",           tier:2, wri:4.9, conflict:3.1, depl:71,  pop:9.9,  extract:2100, tAnom:2.2, precDef:-51 },
  { id:"Qatar",         tier:2, wri:4.8, conflict:3.8, depl:82,  pop:3.0,  extract:2100, tAnom:2.3, precDef:-49 },
  { id:"Saudi Arabia",  tier:2, wri:4.6, conflict:5.2, depl:61,  pop:36.4, extract:943,  tAnom:2.4, precDef:-48 },
  { id:"Jordan",        tier:3, wri:4.5, conflict:5.8, depl:56,  pop:10.8, extract:120,  tAnom:1.7, precDef:-44 },
  { id:"Syria",         tier:3, wri:4.2, conflict:9.3, depl:52,  pop:21.3, extract:112,  tAnom:1.8, precDef:-42 },
  { id:"Iraq",          tier:2, wri:4.0, conflict:8.1, depl:34,  pop:42.8, extract:72,   tAnom:2.0, precDef:-40 },
  { id:"Iran",          tier:3, wri:3.8, conflict:7.2, depl:45,  pop:88.5, extract:78,   tAnom:1.9, precDef:-38 },
];

const norm = (v,lo,hi) => Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
const computeScore = d => +(
  norm(d.wri,0,5)*0.30 + norm(d.conflict,0,10)*0.25 +
  norm(d.depl,0,100)*0.20 + norm(Math.min(d.extract,3000),0,3000)*0.15 +
  norm(Math.abs(d.tAnom),0,4)*0.05 + norm(Math.abs(d.precDef),0,70)*0.05
).toFixed(2)*10/10;

const withScores = COUNTRIES.map(c=>({...c,score:computeScore(c)}))
  .sort((a,b)=>b.score-a.score);

// ── Themes ───────────────────────────────────────────────────
const LIGHT = {
  bg:"#F3EFE7", panel:"#FDFBF8", sidebar:"#F7F3EC",
  grid:"#E2DDD4", rule:"#C8C2B8", ruleHvy:"#A09890",
  t1:"#1A1714", t2:"#4A4540", t3:"#7A736B", t4:"#C0B8B0",
  accent:"#3278A8", dot:"#B0A898",
};
const DARK = {
  bg:"#0A0C11", panel:"#0E1018", sidebar:"#111420",
  grid:"#1A1E2C", rule:"#222838", ruleHvy:"#323A4E",
  t1:"#E2DDD2", t2:"#888C98", t3:"#484E60", t4:"#282E3E",
  accent:"#4FA0D8", dot:"#303848",
};

const TIER = {1:"#B54236",2:"#C07A28",3:"#3278A8",4:"#5A8C6E"};
const tc = t => TIER[t]||TIER[4];

const TIERS_DEF = [
  {tier:1,label:"TIER I  —  CRITICAL BANKRUPTCY",   desc:"Extraction >150% renewable  ·  aquifer >90% depleted"},
  {tier:2,label:"TIER II  —  HIGH COLLAPSE RISK",   desc:"Extraction >500% renewable  ·  fossil aquifer dominant"},
  {tier:3,label:"TIER III  —  ELEVATED STRESS",     desc:"Extraction >100% renewable  ·  structural deficit widening"},
  {tier:4,label:"TIER IV  —  MODERATE STRESS",      desc:"Approaching absolute scarcity threshold"},
];

const STATS = [
  {value:"249.5 M",  label:"Total exposed",    sub:"population",        color:1, size:"xl"},
  {value:"−211 km³", label:"Annual water",     sub:"deficit 2025",      color:2, size:"xl"},
  {value:"7 / 12",   label:"Aquifer systems",  sub:"in active failure",  color:2, size:"lg"},
  {value:"4 States", label:"Active conflict",  sub:"zone overlap",       color:1, size:"lg"},
  {value:"34–90 yr", label:"Aquifer lifespan", sub:"range",              color:"t1",size:"md"},
  {value:"48–124 M", label:"Climate refugees", sub:"projected 2050",     color:3, size:"md"},
];

const ARCH = [
  {tier:"Tier 1  ·  Data Fusion",        items:["GRACE/GLDAS groundwater integration","SAR groundwater proxy mapping","Sentinel-2 crop water stress"]},
  {tier:"Tier 2  ·  Predictive Engine",  items:["Multi-model aquifer depletion forecast","Migration pressure  6–18 month horizon","Conflict-water early warning"]},
  {tier:"Tier 3  ·  Decision Interface", items:["API for gov / NGO pipeline integration","Real-time alert architecture","Operational target: 18 months"]},
];

const NUDGE = {
  "Gaza":         [ 14,  -22],
  "Yemen":        [-18,  -22],
  "Kuwait":       [ 14,  -22],
  "UAE":          [ 14,   18],
  "Qatar":        [-18,   18],
  "Saudi Arabia": [ 14,  -22],
  "Jordan":       [-22,  -22],
  "Syria":        [ 14,   18],
  "Iraq":         [ 14,  -22],
  "Iran":         [-22,  -22],
};

// ── Small helpers ─────────────────────────────────────────────
function Rule({T,mt=0,mb=0,heavy=false}){
  return <div style={{height:1,background:heavy?T.ruleHvy:T.rule,marginTop:mt,marginBottom:mb,flexShrink:0}}/>;
}

function SectionHead({T,label,sub,subRight}){
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
        <span style={{fontSize:8,fontWeight:500,color:T.t1,letterSpacing:"0.04em"}}>{label}</span>
        {subRight&&<span style={{fontSize:5.2,fontWeight:300,color:T.t3}}>{subRight}</span>}
      </div>
      {sub&&<div style={{fontSize:5.2,fontWeight:300,color:T.t3,marginTop:2}}>{sub}</div>}
      <Rule T={T} mt={6}/>
    </div>
  );
}

function Panel({T,children,style={}}){
  return (
    <div style={{
      background:T.sidebar,border:`1px solid ${T.rule}`,borderRadius:2,
      padding:"14px 14px 12px",display:"flex",flexDirection:"column",
      overflow:"hidden",...style,
    }}>
      {children}
    </div>
  );
}

// ── Bar chart ─────────────────────────────────────────────────
function ThreatBars({T}){
  const [hov,setHov]=useState(null);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:3,flex:1,overflowY:"auto"}}>
      {withScores.map((c,i)=>{
        const col=tc(c.tier), isH=hov===c.id;
        return (
          <div key={c.id}
            onMouseEnter={()=>setHov(c.id)} onMouseLeave={()=>setHov(null)}
            style={{
              display:"grid",gridTemplateColumns:"86px 1fr 28px",alignItems:"center",
              gap:8,padding:"3px 6px",
              background:i%2===0?T.grid+"55":"transparent",borderRadius:2,
              cursor:"default",transition:"background 0.1s",
            }}>
            <span style={{fontSize:6.5,fontWeight:isH?600:400,color:isH?col:T.t2,
              whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",transition:"all 0.1s"}}>
              {c.id}
            </span>
            <div style={{position:"relative",height:8}}>
              <div style={{position:"absolute",inset:0,background:T.grid,borderRadius:1}}/>
              <div style={{
                position:"absolute",top:0,left:0,bottom:0,
                width:`${(c.score/10)*100}%`,background:col,
                opacity:isH?0.92:0.72,borderRadius:1,transition:"all 0.15s",
              }}/>
              {[70,50].map(p=>(
                <div key={p} style={{
                  position:"absolute",top:-2,bottom:-2,left:`${p}%`,width:1,
                  background:p===70?TIER[1]:TIER[2],opacity:0.45,
                }}/>
              ))}
            </div>
            <span style={{fontSize:6.5,fontWeight:700,color:col,textAlign:"right"}}>
              {c.score.toFixed(1)}
            </span>
          </div>
        );
      })}
      <div style={{display:"flex",gap:12,marginTop:6,paddingTop:6,borderTop:`1px solid ${T.rule}`}}>
        {[[TIER[1],"Critical 7.0"],[TIER[2],"High risk 5.0"]].map(([col,lbl])=>(
          <div key={lbl} style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:1,height:10,background:col,opacity:0.7}}/>
            <span style={{fontSize:5,color:T.t3}}>{lbl}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Bubble scatter ────────────────────────────────────────────
function BubbleScatter({T}){
  const containerRef=useRef(null);
  const [dims,setDims]=useState({w:500,h:400});
  const [tooltip,setTooltip]=useState(null);

  useEffect(()=>{
    const obs=new ResizeObserver(entries=>{
      const {width,height}=entries[0].contentRect;
      setDims({w:width,h:height});
    });
    if(containerRef.current) obs.observe(containerRef.current);
    return ()=>obs.disconnect();
  },[]);

  const PAD={top:30,right:28,bottom:42,left:46};
  const PW=dims.w-PAD.left-PAD.right;
  const PH=dims.h-PAD.top-PAD.bottom;
  const sx=v=>PAD.left+((v-0.5)/(5.5-0.5))*PW;
  const sy=v=>PAD.top+(1-(v-0.5)/(11.0-0.5))*PH;
  const sr=pop=>Math.sqrt(pop)*(dims.w/500)*3.6;
  const xTicks=[1,2,3,4,5];
  const yTicks=[2,4,6,8,10];
  const qx=sx(3.8), qy=sy(6.5);

  const QUADS=[
    {label:["CATASTROPHIC","RISK ZONE"],  color:1, x:"right", y:"top"},
    {label:["HIGH STRESS","CONFLICT"],    color:2, x:"left",  y:"top"},
    {label:["ECONOMIC RISK","BUFFERED"],  color:3, x:"right", y:"bottom"},
    {label:["STRUCTURAL","STRESS"],       color:4, x:"left",  y:"bottom"},
  ];

  return (
    <div ref={containerRef} style={{flex:1,position:"relative",minHeight:0}}>
      <svg width="100%" height="100%" style={{display:"block"}}>
        {/* Quadrant fills */}
        <rect x={qx} y={PAD.top} width={Math.max(0,sx(5.5)-qx)} height={Math.max(0,qy-PAD.top)} fill={TIER[1]} fillOpacity={0.055}/>
        <rect x={PAD.left} y={PAD.top} width={Math.max(0,qx-PAD.left)} height={Math.max(0,qy-PAD.top)} fill={TIER[2]} fillOpacity={0.045}/>
        <rect x={qx} y={qy} width={Math.max(0,sx(5.5)-qx)} height={Math.max(0,sy(0.5)-qy)} fill={TIER[3]} fillOpacity={0.038}/>
        <rect x={PAD.left} y={qy} width={Math.max(0,qx-PAD.left)} height={Math.max(0,sy(0.5)-qy)} fill={TIER[4]} fillOpacity={0.030}/>

        {/* Dividers */}
        <line x1={qx} y1={PAD.top} x2={qx} y2={PAD.top+PH} stroke={T.ruleHvy} strokeWidth={0.8} strokeDasharray="4,3"/>
        <line x1={PAD.left} y1={qy} x2={PAD.left+PW} y2={qy} stroke={T.ruleHvy} strokeWidth={0.8} strokeDasharray="4,3"/>

        {/* Grid */}
        {xTicks.map(v=><line key={v} x1={sx(v)} y1={PAD.top} x2={sx(v)} y2={PAD.top+PH} stroke={T.grid} strokeWidth={0.4}/>)}
        {yTicks.map(v=><line key={v} x1={PAD.left} y1={sy(v)} x2={PAD.left+PW} y2={sy(v)} stroke={T.grid} strokeWidth={0.4}/>)}

        {/* Quadrant labels */}
        {QUADS.map(q=>{
          const lx=q.x==="right"?PAD.left+PW-10:PAD.left+10;
          const ly=q.y==="top"?PAD.top+8:PAD.top+PH-20;
          const anchor=q.x==="right"?"end":"start";
          return q.label.map((line,li)=>(
            <text key={`${q.label[0]}-${li}`} x={lx} y={ly+li*10}
              textAnchor={anchor} fill={TIER[q.color]} fillOpacity={0.28}
              fontSize={8.5} fontWeight={700} fontFamily="'Inter Tight','Inter',system-ui,sans-serif"
              style={{letterSpacing:"0.04em"}}>
              {line}
            </text>
          ));
        })}

        {/* Axes */}
        <line x1={PAD.left} y1={PAD.top+PH} x2={PAD.left+PW} y2={PAD.top+PH} stroke={T.rule} strokeWidth={0.6}/>
        <line x1={PAD.left} y1={PAD.top} x2={PAD.left} y2={PAD.top+PH} stroke={T.rule} strokeWidth={0.6}/>

        {xTicks.map(v=>(
          <g key={v}>
            <line x1={sx(v)} y1={PAD.top+PH} x2={sx(v)} y2={PAD.top+PH+4} stroke={T.rule} strokeWidth={0.6}/>
            <text x={sx(v)} y={PAD.top+PH+13} textAnchor="middle" fill={T.t3} fontSize={7}
              fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{v}</text>
          </g>
        ))}
        <text x={PAD.left+PW/2} y={dims.h-5} textAnchor="middle" fill={T.t2} fontSize={7.5} fontWeight={400}
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          Water Risk Index  (Aqueduct 4.0  ·  0–5 scale)
        </text>

        {yTicks.map(v=>(
          <g key={v}>
            <line x1={PAD.left-4} y1={sy(v)} x2={PAD.left} y2={sy(v)} stroke={T.rule} strokeWidth={0.6}/>
            <text x={PAD.left-8} y={sy(v)} textAnchor="end" dominantBaseline="middle"
              fill={T.t3} fontSize={7} fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{v}</text>
          </g>
        ))}
        <text transform={`translate(13,${PAD.top+PH/2}) rotate(-90)`} textAnchor="middle"
          fill={T.t2} fontSize={7.5} fontWeight={400}
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          Political Instability Index  (0–10)
        </text>

        {/* Population legend */}
        {[{pop:4,lbl:"4M"},{pop:25,lbl:"25M"},{pop:90,lbl:"90M"}].map(({pop,lbl},i)=>{
          const lx=PAD.left+16+i*48, ly=PAD.top+PH-16, r=sr(pop);
          return (
            <g key={lbl}>
              <circle cx={lx} cy={ly} r={r} fill="none" stroke={T.t3} strokeWidth={0.7} strokeOpacity={0.55}/>
              <text x={lx} y={ly+r+9} textAnchor="middle" fill={T.t3} fontSize={6}
                fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{lbl}</text>
            </g>
          );
        })}
        <text x={PAD.left+14} y={PAD.top+PH-34} fill={T.t3} fontSize={5.5} fontStyle="italic"
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">population →</text>

        {/* Bubbles */}
        {COUNTRIES.map(c=>{
          const col=tc(c.tier), cx_=sx(c.wri), cy_=sy(c.conflict), r=sr(c.pop);
          const [ndx,ndy]=NUDGE[c.id]||[14,-22];
          const lx=cx_+ndx, ly=cy_+ndy;
          const isH=tooltip===c.id;
          return (
            <g key={c.id} onMouseEnter={()=>setTooltip(c.id)} onMouseLeave={()=>setTooltip(null)}
              style={{cursor:"pointer"}}>
              <line x1={cx_} y1={cy_} x2={lx} y2={ly} stroke={col} strokeWidth={0.6} strokeOpacity={0.4}/>
              <circle cx={cx_} cy={cy_} r={isH?r+2:r} fill={col} fillOpacity={isH?0.90:0.72}
                stroke={T.panel} strokeWidth={isH?2:1.5} style={{transition:"all 0.15s"}}/>
              <text x={lx} y={ly-4} textAnchor="middle" fill={col}
                fontSize={isH?7.5:6.5} fontWeight={700}
                fontFamily="'Inter Tight','Inter',system-ui,sans-serif"
                style={{transition:"font-size 0.1s"}}>
                {c.id.toUpperCase()}
              </text>
              <text x={lx} y={ly+6} textAnchor="middle" fill={T.t3} fontSize={5.5}
                fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
                WRI {c.wri.toFixed(1)}
              </text>
            </g>
          );
        })}

        {/* Tooltip */}
        {tooltip&&(()=>{
          const c=COUNTRIES.find(c=>c.id===tooltip);
          const col=tc(c.tier);
          const tx=sx(c.wri), ty=sy(c.conflict);
          const bx=Math.min(tx+16, PAD.left+PW-118);
          const by=Math.max(ty-76, PAD.top+4);
          const rows=[
            `WRI: ${c.wri.toFixed(1)} / 5.0`,
            `Conflict: ${c.conflict.toFixed(1)} / 10.0`,
            `Depletion: ${c.depl}%`,
            `Population: ${c.pop}M`,
            `Composite score: ${computeScore(c).toFixed(1)}`,
          ];
          return (
            <g>
              <rect x={bx} y={by} width={112} height={78} rx={2}
                fill={T.panel} stroke={col} strokeWidth={0.9} opacity={0.97}/>
              <text x={bx+8} y={by+14} fill={col} fontSize={8} fontWeight={700}
                fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{c.id}</text>
              {rows.map((row,i)=>(
                <text key={i} x={bx+8} y={by+26+i*11} fill={T.t2} fontSize={6.2}
                  fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{row}</text>
              ))}
            </g>
          );
        })()}
      </svg>
    </div>
  );
}

// ── Stat block ────────────────────────────────────────────────
function StatBlock({T,stat}){
  const col=typeof stat.color==="number"?TIER[stat.color]:T[stat.color]||T.t1;
  const sizes={xl:22,lg:16,md:12};
  const fs=sizes[stat.size]||14;
  return (
    <div style={{display:"flex",flexDirection:"column"}}>
      <div style={{fontSize:5,fontWeight:500,color:T.t3,letterSpacing:"0.09em",
        textTransform:"uppercase",lineHeight:1.35,marginBottom:3}}>
        {stat.label}<br/>{stat.sub}
      </div>
      <Rule T={T} mb={4}/>
      <div style={{fontSize:fs,fontWeight:700,color:col,letterSpacing:"-0.02em",lineHeight:1}}>
        {stat.value}
      </div>
    </div>
  );
}

// ── Main ──────────────────────────────────────────────────────
function Panel06(){
  const [mode,setMode]=useState("light");
  const T=mode==="light"?LIGHT:DARK;

  return (
    <div style={{
      fontFamily:"'Inter Tight','Inter',system-ui,sans-serif",
      background:T.bg, color:T.t1,
      minHeight:"100vh", display:"flex", flexDirection:"column",
      padding:"12px", gap:8, boxSizing:"border-box",
      transition:"background 0.25s,color 0.25s",
    }}>

      {/* MASTHEAD */}
      <div style={{
        background:T.sidebar, border:`1px solid ${T.rule}`,
        borderRadius:2, padding:"11px 16px", flexShrink:0,
      }}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:5.5,fontWeight:600,color:T.t3,
              letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:5}}>
              Global Water Bankruptcy Project&nbsp;&nbsp;·&nbsp;&nbsp;MENA Water Security Intelligence&nbsp;&nbsp;·&nbsp;&nbsp;UNU-EHS 2026
            </div>
            <div style={{fontSize:16,fontWeight:700,color:T.t1,
              letterSpacing:"-0.025em",lineHeight:1.1,marginBottom:6}}>
              Political Volatility &amp; Composite Threat Index
            </div>
            <div style={{fontSize:6.5,fontWeight:300,color:T.t2,lineHeight:1.5}}>
              Water stress × conflict correlation&nbsp;&nbsp;·&nbsp;&nbsp;Composite bankruptcy score: WRI + FSI + depletion + climate&nbsp;&nbsp;·&nbsp;&nbsp;$25M pilot architecture&nbsp;&nbsp;·&nbsp;&nbsp;Panel 06 / 06
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8,marginLeft:24}}>
            <button onClick={()=>setMode(m=>m==="light"?"dark":"light")} style={{
              padding:"5px 13px", fontSize:6.5, fontWeight:600,
              letterSpacing:"0.08em", background:"transparent", color:T.t3,
              border:`1px solid ${T.rule}`, borderRadius:2, cursor:"pointer",
              textTransform:"uppercase", transition:"all 0.2s",
            }}>
              {mode==="light"?"◑  Dark":"◑  Light"}
            </button>
            <div style={{display:"flex",gap:5,alignItems:"center"}}>
              <span style={{fontSize:4.8,color:T.t4,letterSpacing:"0.08em"}}>PANEL</span>
              {[1,2,3,4,5,6].map(n=>(
                <div key={n} style={{
                  width:17,height:17,borderRadius:2,
                  background:n===6?T.t1:"transparent",
                  border:`1px solid ${n===6?T.t1:T.rule}`,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:7,fontWeight:n===6?700:400,
                  color:n===6?T.bg:T.t4,
                }}>{n}</div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{
        flex:1, display:"grid",
        gridTemplateColumns:"224px 1fr 264px",
        gap:8, minHeight:0,
      }}>

        {/* LEFT */}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>

          <Panel T={T} style={{flex:"0 0 auto",minHeight:310}}>
            <SectionHead T={T} label="Composite Threat Index"
              sub="Weighted: WRI + FSI + depletion + climate" subRight="n=10"/>
            <ThreatBars T={T}/>
          </Panel>

          <Panel T={T} style={{flex:1}}>
            <SectionHead T={T} label="Threat Classification"/>
            <div style={{display:"flex",flexDirection:"column",gap:9,flex:1}}>
              {TIERS_DEF.map(td=>{
                const col=tc(td.tier);
                return (
                  <div key={td.tier} style={{display:"flex",gap:9,alignItems:"flex-start"}}>
                    <div style={{width:4,flexShrink:0,alignSelf:"stretch",
                      background:col,opacity:0.7,borderRadius:1,minHeight:28}}/>
                    <div>
                      <div style={{fontSize:5.8,fontWeight:600,color:col,
                        letterSpacing:"0.05em",marginBottom:2}}>{td.label}</div>
                      <div style={{fontSize:5.2,fontWeight:300,color:T.t3,lineHeight:1.45}}>
                        {td.desc}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            <Rule T={T} mt={10} mb={7}/>
            <div style={{fontSize:4.8,fontWeight:300,color:T.t4,lineHeight:1.6}}>
              UNU GWB 2026&nbsp;·&nbsp;Aqueduct 4.0&nbsp;·&nbsp;GRACE / GRACE-FO&nbsp;·&nbsp;CMIP6 SSP2-4.5
            </div>
          </Panel>
        </div>

        {/* CENTER */}
        <Panel T={T} style={{background:T.panel,display:"flex",flexDirection:"column"}}>
          <SectionHead T={T} label="Water Stress  ×  Political Instability"
            sub="Bubble area proportional to population 2025"
            subRight="Aqueduct WRI vs FSI-derived conflict index"/>
          <BubbleScatter T={T}/>
        </Panel>

        {/* RIGHT */}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>

          <Panel T={T} style={{flex:"0 0 auto"}}>
            <SectionHead T={T} label="Key Indicators"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"18px 14px"}}>
              {STATS.map((s,i)=><StatBlock key={i} T={T} stat={s}/>)}
            </div>
          </Panel>

          <Panel T={T} style={{flex:1}}>
            <div style={{marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                <span style={{fontSize:8,fontWeight:700,color:T.accent,
                  letterSpacing:"-0.01em"}}>$25M AI Pilot</span>
                <span style={{fontSize:5.2,fontWeight:300,color:T.t3}}>
                  18-month  ·  3-tier
                </span>
              </div>
              <Rule T={T} mt={6}/>
            </div>

            <div style={{display:"flex",flexDirection:"column",flex:1}}>
              {ARCH.map((a,i)=>(
                <div key={i}>
                  <div style={{fontSize:6.5,fontWeight:500,color:T.t1,
                    marginBottom:5,marginTop:i>0?10:0}}>{a.tier}</div>
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    {a.items.map((item,j)=>(
                      <div key={j} style={{display:"flex",gap:7,alignItems:"flex-start"}}>
                        <div style={{width:3,height:3,borderRadius:"50%",
                          background:T.t4,flexShrink:0,marginTop:4}}/>
                        <span style={{fontSize:5.5,fontWeight:300,color:T.t2,lineHeight:1.5}}>
                          {item}
                        </span>
                      </div>
                    ))}
                  </div>
                  {i<ARCH.length-1&&<Rule T={T} mt={10}/>}
                </div>
              ))}
            </div>

            <Rule T={T} mt={12} mb={8} heavy/>
            <div style={{fontSize:6,fontWeight:700,color:TIER[1],marginBottom:4}}>
              PILOT  ·  Yemen  ·  Jordan  ·  Gaza
            </div>
            <div style={{fontSize:5.2,fontWeight:300,color:T.t3}}>
              Partners: Maxar&nbsp;&nbsp;·&nbsp;&nbsp;NASA&nbsp;&nbsp;·&nbsp;&nbsp;UNHCR&nbsp;&nbsp;·&nbsp;&nbsp;World Bank
            </div>
          </Panel>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{
        flexShrink:0, borderTop:`1px solid ${T.rule}`,
        paddingTop:7, display:"flex",
        justifyContent:"space-between", alignItems:"center",
      }}>
        <div style={{fontSize:4.8,fontWeight:300,color:T.t4,letterSpacing:"0.03em"}}>
          DATA: UNU GLOBAL WATER BANKRUPTCY REPORT 2026&nbsp;&nbsp;·&nbsp;&nbsp;AQUEDUCT 4.0&nbsp;&nbsp;·&nbsp;&nbsp;FAO AQUASTAT&nbsp;&nbsp;·&nbsp;&nbsp;GRACE/GRACE-FO&nbsp;&nbsp;·&nbsp;&nbsp;CMIP6 SSP2-4.5&nbsp;&nbsp;·&nbsp;&nbsp;UNHCR&nbsp;&nbsp;·&nbsp;&nbsp;IOM&nbsp;&nbsp;·&nbsp;&nbsp;WORLD BANK
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center",flexShrink:0,marginLeft:16}}>
          {Object.entries(TIER).map(([k,col])=>(
            <div key={k} style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{width:8,height:8,borderRadius:1,background:col}}/>
              <span style={{fontSize:4.8,color:T.t4}}>T{k}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Panel06/>);
</script>
</body>
</html>
