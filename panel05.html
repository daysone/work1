<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel 05 — Temperature &amp; Climate Stress</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter Tight', 'Inter', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C8C2B8; border-radius: 2px; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

// ── Data ─────────────────────────────────────────────────────
const COUNTRIES = [
  { id:"Gaza",          tier:1, wri:5.0, conflict:9.8, depl:97,  pop:2.3,  tAnom:1.8, precDef:-55 },
  { id:"Yemen",         tier:1, wri:4.8, conflict:9.7, depl:95,  pop:34.5, tAnom:2.1, precDef:-62 },
  { id:"Kuwait",        tier:2, wri:4.9, conflict:4.2, depl:78,  pop:4.4,  tAnom:2.6, precDef:-53 },
  { id:"UAE",           tier:2, wri:4.9, conflict:3.1, depl:71,  pop:9.9,  tAnom:2.2, precDef:-51 },
  { id:"Qatar",         tier:2, wri:4.8, conflict:3.8, depl:82,  pop:3.0,  tAnom:2.3, precDef:-49 },
  { id:"Saudi Arabia",  tier:2, wri:4.6, conflict:5.2, depl:61,  pop:36.4, tAnom:2.4, precDef:-48 },
  { id:"Jordan",        tier:3, wri:4.5, conflict:5.8, depl:56,  pop:10.8, tAnom:1.7, precDef:-44 },
  { id:"Syria",         tier:3, wri:4.2, conflict:9.3, depl:52,  pop:21.3, tAnom:1.8, precDef:-42 },
  { id:"Iraq",          tier:2, wri:4.0, conflict:8.1, depl:34,  pop:42.8, tAnom:2.0, precDef:-40 },
  { id:"Iran",          tier:3, wri:3.8, conflict:7.2, depl:45,  pop:88.5, tAnom:1.9, precDef:-38 },
];

// Wet-bulb extreme days (days/year exceeding 35°C wet-bulb threshold)
const WETBULB = {
  "Qatar":        { d2025: 40, d2050: 74 },
  "Kuwait":       { d2025: 32, d2050: 62 },
  "UAE":          { d2025: 28, d2050: 55 },
  "Saudi Arabia": { d2025: 24, d2050: 48 },
  "Iraq":         { d2025: 21, d2050: 44 },
  "Yemen":        { d2025: 18, d2050: 38 },
  "Iran":         { d2025: 14, d2050: 31 },
  "Jordan":       { d2025: 11, d2050: 26 },
  "Syria":        { d2025:  9, d2050: 22 },
  "Gaza":         { d2025:  8, d2050: 19 },
};

// ── Temperature curve generation ─────────────────────────────
const YEARS = Array.from({length:61}, (_,i) => 1990+i); // 1990–2050
const PIVOT_YEAR = 2026;

function smoothNoise(i, seed) {
  return (
    Math.sin(i * 0.71 + seed) * 0.10 +
    Math.sin(i * 0.29 + seed * 1.7) * 0.07 +
    Math.sin(i * 1.40 + seed * 0.5) * 0.04
  );
}

function genCurve(c) {
  const seed = (c.id.charCodeAt(0) * 3 + c.id.charCodeAt(1) * 7) % 17;
  const anom2025 = c.tAnom;
  const anom1990 = anom2025 - 36 * 0.036;
  const projRate = 0.044 + (anom2025 - 1.7) * 0.005;
  return YEARS.map(y => {
    const i = y - 1990;
    const n = smoothNoise(i, seed);
    if (y <= PIVOT_YEAR) {
      const t = i / (PIVOT_YEAR - 1990);
      return +(anom1990 + (anom2025 - anom1990) * t + n).toFixed(2);
    } else {
      const extra = y - PIVOT_YEAR;
      return +(anom2025 + extra * projRate + n * 0.35).toFixed(2);
    }
  });
}

const CURVES = COUNTRIES.map(c => ({ ...c, curve: genCurve(c) }));

// ── Climate key stats ─────────────────────────────────────────
const CLIMATE_STATS = [
  { value:"+2.6°C",  label:"Max regional",   sub:"anomaly 2025  ·  Kuwait",    color:1,    size:"xl" },
  { value:"40 days", label:"Qatar wet-bulb",  sub:">35°C  ·  past threshold",   color:1,    size:"lg" },
  { value:"−62%",    label:"Yemen precip",    sub:"deficit vs. 1980 baseline",  color:2,    size:"lg" },
  { value:"2037",    label:"Iraq threshold",  sub:"survivability exceeded",     color:2,    size:"md" },
  { value:"74 days", label:"Qatar by 2050",   sub:"projected wet-bulb days",    color:1,    size:"md" },
  { value:"8 / 10",  label:"Countries",       sub:"on  ≥2°C trajectory",        color:"t1", size:"md" },
];

// ── Themes ───────────────────────────────────────────────────
const LIGHT = {
  bg:"#F3EFE7", panel:"#FDFBF8", sidebar:"#F7F3EC",
  grid:"#E2DDD4", rule:"#C8C2B8", ruleHvy:"#A09890",
  t1:"#1A1714", t2:"#4A4540", t3:"#7A736B", t4:"#C0B8B0",
  accent:"#3278A8", dot:"#B0A898",
};
const DARK = {
  bg:"#0A0C11", panel:"#0E1018", sidebar:"#111420",
  grid:"#1A1E2C", rule:"#222838", ruleHvy:"#323A4E",
  t1:"#E2DDD2", t2:"#888C98", t3:"#484E60", t4:"#282E3E",
  accent:"#4FA0D8", dot:"#303848",
};

const TIER = {1:"#B54236",2:"#C07A28",3:"#3278A8",4:"#5A8C6E"};
const tc = t => TIER[t] || TIER[4];

// ── Small helpers ─────────────────────────────────────────────
function Rule({T, mt=0, mb=0, heavy=false}) {
  return <div style={{height:1, background:heavy?T.ruleHvy:T.rule, marginTop:mt, marginBottom:mb, flexShrink:0}}/>;
}

function SectionHead({T, label, sub, subRight}) {
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
        <span style={{fontSize:8, fontWeight:500, color:T.t1, letterSpacing:"0.04em"}}>{label}</span>
        {subRight && <span style={{fontSize:5.2, fontWeight:300, color:T.t3}}>{subRight}</span>}
      </div>
      {sub && <div style={{fontSize:5.2, fontWeight:300, color:T.t3, marginTop:2}}>{sub}</div>}
      <Rule T={T} mt={6}/>
    </div>
  );
}

function Card({T, children, style={}}) {
  return (
    <div style={{
      background:T.sidebar, border:`1px solid ${T.rule}`, borderRadius:2,
      padding:"14px 14px 12px", display:"flex", flexDirection:"column",
      overflow:"hidden", ...style,
    }}>
      {children}
    </div>
  );
}

function StatBlock({T, stat}) {
  const col = typeof stat.color === "number" ? TIER[stat.color] : T[stat.color] || T.t1;
  const sizes = {xl:22, lg:16, md:12};
  const fs = sizes[stat.size] || 14;
  return (
    <div style={{display:"flex", flexDirection:"column"}}>
      <div style={{fontSize:5, fontWeight:500, color:T.t3, letterSpacing:"0.09em",
        textTransform:"uppercase", lineHeight:1.35, marginBottom:3}}>
        {stat.label}<br/>{stat.sub}
      </div>
      <Rule T={T} mb={4}/>
      <div style={{fontSize:fs, fontWeight:700, color:col, letterSpacing:"-0.02em", lineHeight:1}}>
        {stat.value}
      </div>
    </div>
  );
}

// ── Precipitation deficit bars ────────────────────────────────
function PrecipBars({T}) {
  const sorted = [...COUNTRIES].sort((a,b) => a.precDef - b.precDef);
  const maxDef = 70;
  const [hov, setHov] = useState(null);
  return (
    <div style={{display:"flex", flexDirection:"column", gap:3, flex:1, overflowY:"auto"}}>
      {sorted.map((c, i) => {
        const col = tc(c.tier);
        const isH = hov === c.id;
        const pct = Math.abs(c.precDef) / maxDef * 100;
        return (
          <div key={c.id}
            onMouseEnter={() => setHov(c.id)}
            onMouseLeave={() => setHov(null)}
            style={{
              display:"grid", gridTemplateColumns:"72px 1fr 32px", alignItems:"center",
              gap:6, padding:"2px 4px",
              background: i%2===0 ? T.grid+"55" : "transparent", borderRadius:2, cursor:"default",
            }}>
            <span style={{fontSize:6, fontWeight:isH?600:400, color:isH?col:T.t2,
              whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>
              {c.id}
            </span>
            <div style={{position:"relative", height:7}}>
              <div style={{position:"absolute", inset:0, background:T.grid, borderRadius:1}}/>
              <div style={{
                position:"absolute", top:0, left:0, bottom:0,
                width:`${pct}%`, background:col, opacity:isH?0.90:0.65, borderRadius:1,
                transition:"all 0.15s",
              }}/>
            </div>
            <span style={{fontSize:6, fontWeight:700, color:col, textAlign:"right"}}>
              {c.precDef}%
            </span>
          </div>
        );
      })}
    </div>
  );
}

// ── Temperature anomaly curves ────────────────────────────────
function TempCurves({T}) {
  const containerRef = useRef(null);
  const [dims, setDims] = useState({w:600, h:400});
  const [hov, setHov] = useState(null);

  useEffect(() => {
    const obs = new ResizeObserver(entries => {
      const {width, height} = entries[0].contentRect;
      setDims({w:width, h:height});
    });
    if (containerRef.current) obs.observe(containerRef.current);
    return () => obs.disconnect();
  }, []);

  const PAD = {top:32, right:96, bottom:44, left:46};
  const PW = dims.w - PAD.left - PAD.right;
  const PH = dims.h - PAD.top - PAD.bottom;

  const Y_MIN = 0.0, Y_MAX = 3.6;
  const X_MIN = 1990, X_MAX = 2050;
  const sx = yr => PAD.left + (yr - X_MIN) / (X_MAX - X_MIN) * PW;
  const sy = v  => PAD.top  + (1 - (v - Y_MIN) / (Y_MAX - Y_MIN)) * PH;

  const yTicks = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5];
  const xTickLabels = [1990, 2000, 2010, 2020, 2030, 2040, 2050];
  const xGridTicks = Array.from({length:13}, (_,i) => 1990 + i*5);

  const pivotIdx = YEARS.indexOf(PIVOT_YEAR);
  const pivotX = sx(PIVOT_YEAR);

  const makePath = (curve, startIdx, endIdx) =>
    YEARS.slice(startIdx, endIdx + 1).map((y, j) => {
      const x = sx(y), yv = sy(curve[startIdx + j]);
      return `${j === 0 ? "M" : "L"}${x.toFixed(1)},${yv.toFixed(1)}`;
    }).join(" ");

  // Sort by 2025 anomaly descending for label stacking
  const sortedForLabels = [...CURVES].sort((a,b) => b.tAnom - a.tAnom);

  return (
    <div ref={containerRef} style={{flex:1, position:"relative", minHeight:0}}>
      <svg width="100%" height="100%" style={{display:"block"}}>

        {/* Projected region tint */}
        <rect x={pivotX} y={PAD.top}
          width={Math.max(0, sx(X_MAX) - pivotX)} height={PH}
          fill={T.grid} fillOpacity={0.42}/>

        {/* Paris band 1.5–2.0°C */}
        <rect x={PAD.left} y={sy(2.0)}
          width={PW} height={Math.max(0, sy(1.5) - sy(2.0))}
          fill={TIER[2]} fillOpacity={0.055}/>

        {/* Grid */}
        {xGridTicks.map(v => (
          <line key={v} x1={sx(v)} y1={PAD.top} x2={sx(v)} y2={PAD.top+PH}
            stroke={T.grid} strokeWidth={0.4}/>
        ))}
        {yTicks.map(v => (
          <line key={v} x1={PAD.left} y1={sy(v)} x2={PAD.left+PW} y2={sy(v)}
            stroke={T.grid} strokeWidth={0.5}/>
        ))}

        {/* 1.5°C reference */}
        <line x1={PAD.left} y1={sy(1.5)} x2={PAD.left+PW} y2={sy(1.5)}
          stroke={TIER[2]} strokeWidth={0.9} strokeOpacity={0.55} strokeDasharray="5,3"/>
        <text x={PAD.left+5} y={sy(1.5)-4}
          fill={TIER[2]} fillOpacity={0.7} fontSize={5.5}
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          Paris 1.5°C
        </text>

        {/* 2.0°C reference */}
        <line x1={PAD.left} y1={sy(2.0)} x2={PAD.left+PW} y2={sy(2.0)}
          stroke={TIER[1]} strokeWidth={0.9} strokeOpacity={0.55} strokeDasharray="5,3"/>
        <text x={PAD.left+5} y={sy(2.0)-4}
          fill={TIER[1]} fillOpacity={0.7} fontSize={5.5}
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          2.0°C limit
        </text>

        {/* NOW line */}
        <line x1={pivotX} y1={PAD.top - 8} x2={pivotX} y2={PAD.top + PH}
          stroke={T.ruleHvy} strokeWidth={1} strokeDasharray="3,2"/>
        <text x={pivotX + 4} y={PAD.top - 1}
          fill={T.t3} fontSize={5.5}
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          NOW
        </text>

        {/* Projected label */}
        <text
          x={pivotX + (sx(X_MAX) - pivotX) / 2}
          y={PAD.top + 14}
          fill={T.t3} fontSize={5} fontStyle="italic" textAnchor="middle"
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          SSP2-4.5 projected →
        </text>

        {/* Country curves */}
        {CURVES.map(c => {
          const col = tc(c.tier);
          const isH = hov === c.id;
          const dimmed = hov && hov !== c.id;
          const histPath = makePath(c.curve, 0, pivotIdx);
          const projPath = makePath(c.curve, pivotIdx, YEARS.length - 1);
          const finalAnom = c.curve[YEARS.length - 1];

          return (
            <g key={c.id}
              onMouseEnter={() => setHov(c.id)}
              onMouseLeave={() => setHov(null)}
              style={{cursor:"pointer"}}>
              {/* Historical solid */}
              <path d={histPath} fill="none" stroke={col}
                strokeWidth={isH ? 2.2 : 1.2}
                strokeOpacity={isH ? 0.95 : dimmed ? 0.12 : 0.72}
                style={{transition:"all 0.15s"}}/>
              {/* Projected dashed */}
              <path d={projPath} fill="none" stroke={col}
                strokeWidth={isH ? 1.8 : 1.0}
                strokeOpacity={isH ? 0.80 : dimmed ? 0.08 : 0.50}
                strokeDasharray="4,2.5"
                style={{transition:"all 0.15s"}}/>
              {/* Pivot dot (2025/26 anomaly) */}
              <circle cx={pivotX} cy={sy(c.tAnom)}
                r={isH ? 3.5 : 2}
                fill={col}
                fillOpacity={isH ? 1.0 : dimmed ? 0.2 : 0.75}
                style={{transition:"all 0.15s"}}/>
              {/* 2050 label */}
              <text x={PAD.left + PW + 7} y={sy(finalAnom) + 2.5}
                fill={col} fontSize={isH ? 7 : 6}
                fontWeight={isH ? 700 : 400}
                fillOpacity={dimmed ? 0.2 : 0.85}
                fontFamily="'Inter Tight','Inter',system-ui,sans-serif"
                style={{transition:"all 0.15s"}}>
                {c.id.length > 8 ? c.id.slice(0,7) + "…" : c.id}
              </text>
            </g>
          );
        })}

        {/* Tooltip */}
        {hov && (() => {
          const c = CURVES.find(x => x.id === hov);
          const col = tc(c.tier);
          const anom2050 = c.curve[CURVES[0].curve.length - 1];
          const wb = WETBULB[c.id];
          const bx = Math.max(PAD.left + 4, Math.min(sx(2010), PAD.left + PW - 128));
          const by = Math.max(PAD.top + 4, sy(c.tAnom) - 78);
          const rows = [
            `Anomaly 2025:  +${c.tAnom.toFixed(1)}°C`,
            `Anomaly 2050:  +${anom2050.toFixed(1)}°C`,
            `Precip deficit:  ${c.precDef}%`,
            wb ? `Wet-bulb days:  ${wb.d2025} (→ ${wb.d2050} by 2050)` : "",
          ].filter(Boolean);
          return (
            <g>
              <rect x={bx} y={by} width={128} height={rows.length * 11 + 22} rx={2}
                fill={T.panel} stroke={col} strokeWidth={0.9} opacity={0.97}/>
              <text x={bx+8} y={by+14} fill={col} fontSize={8} fontWeight={700}
                fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{c.id}</text>
              {rows.map((row, i) => (
                <text key={i} x={bx+8} y={by+26+i*11}
                  fill={T.t2} fontSize={6}
                  fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{row}</text>
              ))}
            </g>
          );
        })()}

        {/* Axes */}
        <line x1={PAD.left} y1={PAD.top+PH} x2={PAD.left+PW} y2={PAD.top+PH}
          stroke={T.rule} strokeWidth={0.6}/>
        <line x1={PAD.left} y1={PAD.top} x2={PAD.left} y2={PAD.top+PH}
          stroke={T.rule} strokeWidth={0.6}/>

        {/* X axis */}
        {xTickLabels.map(y => (
          <g key={y}>
            <line x1={sx(y)} y1={PAD.top+PH} x2={sx(y)} y2={PAD.top+PH+4}
              stroke={T.rule} strokeWidth={0.6}/>
            <text x={sx(y)} y={PAD.top+PH+13}
              textAnchor="middle" fill={T.t3} fontSize={6.5}
              fontFamily="'Inter Tight','Inter',system-ui,sans-serif">{y}</text>
          </g>
        ))}
        <text x={PAD.left+PW/2} y={dims.h-4}
          textAnchor="middle" fill={T.t2} fontSize={7} fontWeight={400}
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          Year
        </text>

        {/* Y axis */}
        {yTicks.map(v => (
          <g key={v}>
            <line x1={PAD.left-3} y1={sy(v)} x2={PAD.left} y2={sy(v)}
              stroke={T.rule} strokeWidth={0.6}/>
            <text x={PAD.left-6} y={sy(v)+2.5}
              textAnchor="end" fill={T.t3} fontSize={6.5}
              fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
              +{v.toFixed(1)}
            </text>
          </g>
        ))}
        <text transform={`translate(12,${PAD.top+PH/2}) rotate(-90)`}
          textAnchor="middle" fill={T.t2} fontSize={7} fontWeight={400}
          fontFamily="'Inter Tight','Inter',system-ui,sans-serif">
          Temperature Anomaly (°C  ·  vs. 1951–1980 baseline)
        </text>

      </svg>
    </div>
  );
}

// ── Wet-bulb extreme days ─────────────────────────────────────
function WetBulbChart({T}) {
  const [hov, setHov] = useState(null);
  const sorted = [...COUNTRIES].sort((a,b) =>
    (WETBULB[b.id]?.d2025 || 0) - (WETBULB[a.id]?.d2025 || 0)
  );
  const MAX_DAYS = 80;
  const THRESHOLD_DAYS = 15;
  const threshPct = THRESHOLD_DAYS / MAX_DAYS * 100;

  return (
    <div style={{display:"flex", flexDirection:"column", flex:1, minHeight:0}}>
      {/* Legend */}
      <div style={{display:"flex", gap:14, marginBottom:8, flexWrap:"wrap"}}>
        <div style={{display:"flex", alignItems:"center", gap:4}}>
          <div style={{width:14, height:5, background:T.t2, borderRadius:1, opacity:0.65}}/>
          <span style={{fontSize:5, color:T.t3}}>2025 actual</span>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:4}}>
          <div style={{width:14, height:5, background:T.t3, borderRadius:1, opacity:0.28,
            outline:`1px dashed ${T.t3}`}}/>
          <span style={{fontSize:5, color:T.t3}}>2050 projected</span>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:4, marginLeft:"auto"}}>
          <div style={{width:1, height:10, background:TIER[1], opacity:0.7}}/>
          <span style={{fontSize:5, color:T.t3}}>health threshold</span>
        </div>
      </div>

      <div style={{display:"flex", flexDirection:"column", gap:4, flex:1, overflowY:"auto"}}>
        {sorted.map((c, i) => {
          const wb = WETBULB[c.id];
          if (!wb) return null;
          const col = tc(c.tier);
          const isH = hov === c.id;
          const isPast = wb.d2025 > THRESHOLD_DAYS;
          const pct25 = wb.d2025 / MAX_DAYS * 100;
          const pct50 = wb.d2050 / MAX_DAYS * 100;
          return (
            <div key={c.id}
              onMouseEnter={() => setHov(c.id)}
              onMouseLeave={() => setHov(null)}
              style={{
                display:"grid", gridTemplateColumns:"76px 1fr 44px", alignItems:"center",
                gap:6, padding:"3px 4px",
                background: i%2===0 ? T.grid+"55" : "transparent", borderRadius:2, cursor:"default",
              }}>
              <span style={{fontSize:6, fontWeight:isH?600:400, color:isH?col:T.t2,
                whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>
                {c.id}
              </span>
              <div style={{position:"relative", height:12}}>
                <div style={{position:"absolute", inset:0, background:T.grid, borderRadius:1}}/>
                {/* 2050 shadow bar */}
                <div style={{
                  position:"absolute", top:0, left:0, bottom:0,
                  width:`${pct50}%`, background:col, opacity:0.20, borderRadius:1,
                }}/>
                {/* 2025 bar */}
                <div style={{
                  position:"absolute", top:0, left:0, bottom:0,
                  width:`${pct25}%`, background:col, opacity:isH?0.90:0.65, borderRadius:1,
                  transition:"all 0.15s",
                }}/>
                {/* Threshold marker */}
                <div style={{
                  position:"absolute", top:-2, bottom:-2,
                  left:`${threshPct}%`, width:1,
                  background:TIER[1], opacity:0.65,
                }}/>
              </div>
              <div style={{display:"flex", alignItems:"center", gap:3, justifyContent:"flex-end"}}>
                {isPast && (
                  <div style={{width:4, height:4, borderRadius:"50%",
                    background:TIER[1], flexShrink:0}}/>
                )}
                <span style={{fontSize:6, fontWeight:700, color:col, textAlign:"right"}}>
                  {wb.d2025}d
                </span>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{marginTop:6, paddingTop:6, borderTop:`1px solid ${T.rule}`}}>
        <span style={{fontSize:4.8, fontWeight:300, color:T.t4, lineHeight:1.6}}>

          Qatar 40d already past outdoor survivability limit
        </span>
      </div>
    </div>
  );
}
